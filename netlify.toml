# Netlify yapılandırması — statik site + haber fonksiyonu
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# HTML her zaman taze gelsin (içerik güncellemeleri hemen görünür)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# JS/CSS sürümlü (?v=) olduğundan uzun süre önbelleğe alınabilir
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
